  - rule_id: WA-SB6002-schools
    state_code: WA
    state_division_id: de05ce45-04d6-4428-a3a1-fbd7984786fc  # Overture GERS: Washington
    statute_name: "Driver Privacy Act (SB 6002)"
    statute_citation: "Wash. SB 6002 (2026), RCW Title 46 (new chapter)"
    effective_date: 2026-03-30
    restricted_category: school
    statutory_language: >-
      "on or immediately surrounding" the protected premises (no numeric
      distance given; wording paraphrased from bill summary, verify against
      final RCW text)
    buffer_meters: null
    buffer_specified: false   # "on or immediately surrounding" - no numeric distance in bill summary reviewed
    statutory_exclusions: >-
      SB 6002 excludes "automated school bus safety cameras, speed safety
      camera systems, and automated traffic safety camera systems, as defined
      in RCW 46.63.210" from its ALPR definition. A device of those types is
      not covered by this rule - verify device type before reporting.
    retention_days: 21
    source_url: "https://app.leg.wa.gov/billsummary?BillNumber=6002&Year=2026"
    confidence: needs_review  # secondary sources conflict on whether a 300ft figure appears in final text
    last_verified: 2026-07-18

