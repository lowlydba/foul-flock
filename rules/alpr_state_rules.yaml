    verdict: no_siting_law
    note: "29-A M.R.S. §2117-A use/retention limits; no siting language."
    last_verified: 2026-07-18
  - state_code: NC
    verdict: no_siting_law
    note: "Transparency/use rules only; no protected-location siting ban."
    last_verified: 2026-07-18

  - state_code: AL
    verdict: no_alpr_statute
    note: >-
      No enacted statutory law. Alabama Criminal Justice Information Center
      issued administrative rules (Ala. Admin. Code r. 265-X-6-.01 et seq.,
      eff.
    source_url: "https://www.law.cornell.edu/regulations/alabama/Ala-Admin-Code-r-265-X-6-.01"
