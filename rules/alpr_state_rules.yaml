# ALPR state siting rules - HAND-CURATED, do not automate/scrape.
#
# This file is the legal core of the project. Every entry must carry a
# source_url, confidence, and last_verified date. Re-review quarterly
# (aligned to state legislative sessions).
#
# confidence values:
#   verified     - statute text read directly by a human maintainer
#   inferred     - from secondary sources (trackers, news); needs primary check
#   needs_review - flagged for re-verification before advocacy use
#
# buffer_meters / buffer_specified:
#   If the statute gives a numeric distance, put it in buffer_meters and set
#   buffer_specified: true. If the law uses vague language ("immediate
#   surrounding", "on or within"), leave buffer_meters null and set
#   buffer_specified: false - the build will apply the configurable
#   default_heuristic_buffer_m below and the UI will label the result as a
#   heuristic proximity check, NOT a legal threshold.

# Heuristic fallback distance (meters) used ONLY when a statute gives no
# numeric distance. Override at build time with --default-buffer.
default_heuristic_buffer_m: 100

# Manufacturers primarily known for camera types excluded from ALPR statutes
# (school-bus safety, speed safety, automated traffic safety systems).
# Cameras from these vendors in states whose rules declare
# statutory_exclusions are marked "possible_exclusion" instead of flagged,
# to reduce false positives. Tagging is crowdsourced - treat as a hint.
exclusion_manufacturer_watchlist:
  - Verra Mobility
  - Redflex
  - American Traffic Solutions
  - Conduent
  - Sensys Gatso
  - NovoaGlobal
  - Blue Line Solutions
  - Altumint
  - BusPatrol

# Maps rule restricted_category values to Overture places taxonomy codes.
# The taxonomy is vendored at build/vendor/overture_categories.csv (CC-BY-4.0,
# from the OvertureMaps/schema repo; see build/vendor/README.md for the pin).
# A place matches a protected category when its categories.primary code
# equals a listed code OR has one as a taxonomy ancestor, so
# "elementary_school" matches via "school" ([education,school,...]).
# If you change this mapping, delete cache/overture_places_*.json so the
# next build refetches (cached files record the mapping they were built
# with and self-invalidate, but only when online).
category_overture_mapping:
  school:
    # education > school subtree: K-12 and equivalents (charter, public,
    # private, elementary/middle/high, montessori, preschool, religious).
    # college_university deliberately excluded for parity with the prior
    # OSM amenity=school scope; revisit per statute if a law clearly
    # covers higher education.
    - school
  place_of_worship:
    # religious_organization subtree: church_cathedral, mosque, synagogue,
    # temple, buddhist/hindu/sikh temples, shinto_shrines,
    # religious_destination.
    - religious_organization
  healthcare_facility:
    # Hospitals, medical centers, and urgent care. The generic doctor
    # subtree was evaluated and dropped 2026-07-18: Overture carries every
    # individual specialist practice (~9x OSM's healthcare count), which
    # buried real facilities in strip-mall office noise. Pediatric
    # practices are retained (child-focused sites are squarely what these
    # statutes protect), and childrens_hospital sits outside the hospital
    # subtree in the taxonomy so it needs its own anchor. Also excludes
    # dentists, counseling, labs, and B2B medical suppliers.
    - hospital
    - childrens_hospital
    - medical_center
    - urgent_care_clinic
    - pediatrician
  courthouse:
    - courthouse
  food_bank:
    - food_banks

# States checked and found to have NO siting-specific ALPR statute (retention/
# access/use rules only, or nothing). Drives the "no siting law found" UI
# state. Deliberately NOT exhaustive - absence from this list means
# "not yet reviewed", which the UI also distinguishes.
states_reviewed_no_siting_law:
