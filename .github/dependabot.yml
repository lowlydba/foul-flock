# Dependabot: version updates for every ecosystem in the repo.
# Actions are SHA-pinned with version comments; dependabot understands
# that convention and bumps both the SHA and the comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      npm-dev:
        dependency-type: development
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - "/build"
      - "/tests/python"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
