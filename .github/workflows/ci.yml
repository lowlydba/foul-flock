name: ci

# Test suite: pytest for the Python build pipeline, and WCAG 2.1 A/AA
# regression checks (axe-core via pa11y-ci) against the static site in
# light and dark color schemes. The pa11y job uses committed fixture data in
# tests/fixtures/data since real build artifacts are gitignored.
# The are-we-good job is the single check to require in branch protection.

on:
  push:
    branches: [main]
  pull_request:

# Read-only suite: checks out code and runs tests, writes nothing.
permissions:
  contents: read # check out the repository

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python build pipeline tests
    runs-on: ubuntu-slim
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r tests/python/requirements.txt

      - name: Run pytest
        run: python -m pytest tests/python -q

  pa11y:
    name: Pa11y WCAG scan (${{ matrix.scheme }})
    runs-on: ubuntu-latest # Chromium needs system libraries ubuntu-slim lacks
    strategy:
      fail-fast: false
      matrix:
        scheme: [light, dark]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Tune npm for CI
        uses: lowlydba/sustainable-npm@4cc1da285e5a589a7b3816122f791c21ec6ff3e6 # v4.0.0

      - name: Install test dependencies
        if: matrix.scheme == 'light' # map tests are scheme-independent; run once
        run: npm ci

      - name: Install Chrome for map tests
        if: matrix.scheme == 'light'
        run: npx --no-install puppeteer browsers install chrome

      - name: Stage fixture data
        run: |
          mkdir -p web/data
          cp tests/fixtures/data/* web/data/

      - name: Start static server
        run: |
          node tests/serve.cjs 8081 web &
          for _ in $(seq 30); do
            curl --fail --silent --output /dev/null http://127.0.0.1:8081/ && exit 0
            sleep 1
          done
          echo "Static server did not start" >&2
          exit 1

      - name: Run map regression tests
        if: matrix.scheme == 'light'
        run: npm run test:map

      - name: Run pa11y-ci
        id: pa11y
        uses: lowlysre/pa11y-ci-action@84174759cd514bd3ea3bcaa30dc1798dde81f713 # v1.1.0
        env:
          A11Y_SCHEME: ${{ matrix.scheme }}
        with:
          config: .pa11yci.cjs

      - name: Upload report
        if: ${{ !cancelled() && steps.pa11y.outputs.report-json != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pa11y-report-${{ matrix.scheme }}
          path: ${{ steps.pa11y.outputs.report-json }}
          retention-days: 7

  are-we-good:
    name: Are we good?
    runs-on: ubuntu-slim
    needs: [pytest, pa11y]
    if: always()
    steps:
      - name: Roll up job results
        uses: lowlydba/are-we-good@6b10e5f2697555fbaf7f8f37ce38d4454c954a4c # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
