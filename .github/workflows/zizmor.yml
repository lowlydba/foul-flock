name: zizmor

# Static analysis of the GitHub Actions workflows themselves, at zizmor's
# strictest (pedantic) persona. Findings land in the Security tab via
# SARIF upload and fail the run.

on:
  push:
    branches: [main]
  pull_request:

# No workflow-level grants; the audit job declares what it needs.
permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows (pedantic)
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the workflows under audit
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          persona: pedantic
          advanced-security: false
