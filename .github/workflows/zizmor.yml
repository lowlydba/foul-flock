name: zizmor

# Static analysis of the GitHub Actions workflows themselves, at zizmor's
# strictest (pedantic) persona. Findings land in the Security tab via
# SARIF upload and fail the run.

on:
  push:
    branches: [main]
  pull_request:

# No workflow-level grants; the audit job declares what it needs.
permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows (pedantic)
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the workflows under audit
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: pedantic
          advanced-security: false
