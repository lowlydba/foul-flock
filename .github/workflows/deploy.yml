name: deploy

# Publishes web/ as the GitHub Pages site root (workflow build type, not
# legacy branch serving), so the app lives at foulflock.com/ with no /web
# subdirectory. web/data/* is committed on main by data-refresh auto-PRs
# and ships inside the artifact; the checkout includes tracked files
# regardless of .gitignore.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# No workflow-level grants; the deploy job declares what it needs.
permissions: {}

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy web/ to Pages
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository for the artifact
      pages: write # create the Pages deployment
      id-token: write # OIDC token that deploy-pages presents to the Pages API
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
